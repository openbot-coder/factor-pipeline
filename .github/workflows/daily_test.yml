name: Daily Tests

on:
  schedule:
    # Run daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test-all-factors:
    name: Test All Factors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: List all registered factors
        run: |
          python run.py factors | tee factors_list.txt
          echo "=== Factor Count ===" >> $GITHUB_STEP_SUMMARY
          wc -l factors_list.txt >> $GITHUB_STEP_SUMMARY || true

      - name: Run full batch analysis
        run: |
          python run.py run \
            --factors alpha001 alpha002 alpha003 alpha004 alpha005 \
            alpha006 alpha007 alpha008 alpha009 alpha010 \
            --out reports/daily
        continue-on-error: true

      - name: Generate summary report
        if: always()
        run: |
          if [ -f reports/daily/summary.csv ]; then
            echo "## Daily Test Summary" >> $GITHUB_STEP_SUMMARY
            cat reports/daily/summary.csv >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-results
          path: |
            reports/
            factors_list.txt
          retention-days: 7

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: test-all-factors
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Daily Test Completed" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.test-all-factors.result }}" >> $GITHUB_STEP_SUMMARY
