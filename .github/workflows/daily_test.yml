name: Daily Tests

on:
  schedule:
    # Run daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test-all-factors:
    name: Test All Factors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: List all registered factors
        run: |
          fp factor list | tee factors_list.txt
          echo "=== Factor Count ===" >> $GITHUB_STEP_SUMMARY
          wc -l factors_list.txt >> $GITHUB_STEP_SUMMARY || true

      - name: Run full batch analysis
        run: |
          mkdir -p reports/daily
          # factor batch requires a file path containing one expression per line
          cat > /tmp/factors.txt <<'EOF'
          $close
          Mean($close, 5)
          Mean($close, 20)
          Std($close, 20)
          Delta($close, 1)
          Rank($close)
          Log($volume)
          Corr($close, $volume, 20)
          EOF
          fp factor batch /tmp/factors.txt --output reports/daily || true
        continue-on-error: true

      - name: Generate summary report
        if: always()
        run: |
          if [ -f reports/daily/summary.csv ]; then
            echo "## Daily Test Summary" >> $GITHUB_STEP_SUMMARY
            cat reports/daily/summary.csv >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-results
          path: |
            reports/
            factors_list.txt
          retention-days: 7

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: test-all-factors
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Daily Test Completed" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.test-all-factors.result }}" >> $GITHUB_STEP_SUMMARY
