[project]
name = "factor-pipeline"
version = "0.1.0"
description = "Quantitative factor detection pipeline: calculate → IC/IR analyze → layered backtest → HTML report"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "openbot-coder", email = "openbot@example.com" }
]
keywords = ["quantitative", "factor", "alpha", "trading", "finance", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "ta>=0.10",
    "jinja2>=3.1",
    "duckdb>=1.0",
    "click>=8.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "black>=23.0",
    "mypy>=1.5",
]
test = [
    "duckdb>=1.0",
    "pytest>=7.4",
]
data = [
    "baostock>=0.9",
    "akshare>=1.10",
]

[project.scripts]
fp = "factor_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/openbot-coder/factor-pipeline"
Documentation = "https://github.com/openbot-coder/factor-pipeline#readme"
Repository = "https://github.com/openbot-coder/factor-pipeline"
Issues = "https://github.com/openbot-coder/factor-pipeline/issues"

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "F401",   # unused imports (some are intentional re-exports)
    "F821",   # undefined names (e.g. pd used without import in CLI)
    "E712",   # comparison to True/False
    "E721",   # type comparison
    "E741",   # ambiguous variable names (l, r in factor code)
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factor_pipeline"]
